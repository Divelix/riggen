[package]
name = "riggen-export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `TriMesh`, the STL writer and the hull: exported meshes are baked to
# meters and written as binary STL (ADR-0008).
riggen-mesh.workspace = true
# `Robot`, `validate`, `fk` and `compose_inertial`: `resolve` reads the
# document and the export CLI's `.riggen` loader is `riggen_core::load`.
riggen-core.workspace = true
# `<name>.fk.json`, the FK samples the MuJoCo CI test reads (`fk_samples`).
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The URDF round-trip: our writer's output parsed by an independent reader,
# FK recomputed from the parsed numbers (step 6). A real dependency once
# `urdf_in` exists (step 13).
urdf-rs.workspace = true
