[package]
name = "riggen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The robot assembler for RL researchers: drop meshes, build the kinematic tree, place joints, export MJCF and URDF"
# The README is the repository's, one level above the package root;
# `cargo package` copies it into the tarball.
readme = "../../README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# What the package carries. `tests/` stays out: the snapshot PNGs under it
# are 23 MB against crates.io's 10 MB limit. `assets/arm/` are symlinks to
# `assets/fixtures/arm/`, the sample the `--example arm` bytes come from
# (`src/example.rs`); Cargo dereferences them when it packages, so the
# fixtures stay the single source and the registry build has its copy.
include = ["src/**", "build.rs", "assets/**"]

# `rlib` for the tests and the bin, `cdylib` for the wasm bundle the web
# demo loads (ADR-0017). The package is `riggen`, the name `cargo install`
# takes; the lib keeps `riggen_app`, so `riggen_app::` in the bin and the
# tests, `riggen_app.wasm` and `web/main.js` stay as they were.
[lib]
name = "riggen_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "riggen"
path = "src/main.rs"

# `cargo test` never runs this one: it is the on-demand "show me the app right
# now" capture (ADR-0003), asked for by name and compared against nothing.
[[test]]
name = "visual_scratch"
path = "tests/visual_scratch.rs"
test = false

[dependencies]
riggen-mesh.workspace = true
riggen-core.workspace = true
# `--export` on the command line and File › Export… (M3).
riggen-export.workspace = true
riggen-viewport.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
# `debug_state()` serialises what the app thinks it drew; the snapshot suite
# compares that JSON against a committed golden (ADR-0003).
serde.workspace = true
serde_json.workspace = true
web-time.workspace = true
transform-gizmo-egui.workspace = true
# File › Export… as one download in the browser, and the native test that
# reads the archive back (ADR-0017 §6).
zip.workspace = true

# Native file dialogs (File › Open). Not built for wasm: the browser has no
# filesystem to reach for.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

# The visual-snapshot suite (`tests/visual/`, ADR-0003). Native-only and
# dev-only: it never reaches the shipped binary or the wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest.workspace = true
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Not used directly: `ahash`, pulled in with default features by
# `transform-gizmo` (ADR-0007), wants a `getrandom` backend, and on
# wasm32-unknown-unknown one has to be named. See `.cargo/config.toml` for
# the matching cfg — the feature alone is not enough.
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# `Uint8Array` and `Array`: the shape a `Blob` is built from.
js-sys = "0.3"
# The download: a `Blob`, an object URL, and a synthetic click on an
# `<a download>` — the only way out of a page (ADR-0017 §6). `console` is
# where a file the browser failed to read is reported.
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Url",
    "console",
] }
console_error_panic_hook = "0.1"
