# The `riggen` wheel (ADR-0002, ADR-0009): one wheel per platform carrying
# both halves of the product — the native `riggen` executable built from
# `crates/riggen-app`, and the PyO3 extension module `riggen._riggen` built
# from `crates/riggen-py` for `import riggen`. maturin builds the extension
# (`bindings = "pyo3"`, abi3, so one wheel covers every CPython ≥ 3.10) and
# takes the binary from the wheel data directory `riggen._riggen.data/scripts/`,
# which `python/build_wheel.py` fills with a `cargo build` of the app first.
# maturin cannot build a `[[bin]]` and an extension from one crate into one
# wheel, hence the two crates and the data directory (the layout rerun uses).
#
# Lives at the repository root so that `README.md` is both the GitHub page
# and the PyPI page (plans/m4-distribution OPEN 3): one file, no copy.
#
# Build locally:  python python/build_wheel.py     # cargo build the app → the data dir → maturin build
#                 # dist/riggen-<ver>-cp310-abi3-<platform>.whl
# Smoke-test it:  uv venv target/wheel-venv && uv pip install --python target/wheel-venv dist/*.whl
#                 python python/tests/test_wheel.py target/wheel-venv
#
# A plain `uv build` / `pip install .` from the sdist builds the extension
# module only — the data directory is absent there, so the wheel has no
# binary and `python -m riggen` says how to get one (plans/python-sdk OPEN 3).

[project]
name = "riggen"
description = "The blazingly fast, lightweight robot assembler for RL researchers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Sergei Sergienko" }]
keywords = ["robotics", "mujoco", "mjcf", "urdf", "reinforcement-learning", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
# The version is read from the workspace `Cargo.toml` (`version.workspace =
# true` on riggen-app), so it lives once.
dynamic = ["version"]

# No `[project.scripts]` on purpose: maturin drops the `riggen` binary into
# the wheel's `scripts/` directory — the venv's `bin/` — so the `riggen`
# command *is* the binary, with no Python interpreter in front of it (the
# startup budget, docs/03-roadmap.md §M4). A console script of the same
# name would shadow it.

[project.urls]
Repository = "https://github.com/Divelix/riggen"
Documentation = "https://github.com/Divelix/riggen#readme"

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/riggen-py/Cargo.toml"
module-name = "riggen._riggen"
# Stops PyO3 from linking libpython (crates/riggen-py/Cargo.toml).
features = ["extension-module"]
python-source = "python"
# The wheel data directory is maturin's default, `<module-name>.data/` beside
# this file — `riggen._riggen.data/` — and deliberately not a `data = …`
# setting: an explicit path must exist or maturin fails, the default is
# skipped when absent, and the sdist has no binary to put there. The build
# fills `riggen._riggen.data/scripts/riggen[.exe]` (`python/build_wheel.py`),
# maturin packages it as `riggen-<ver>.data/scripts/`, which installs to the
# environment's `bin/` — exactly where M4's `bindings = "bin"` put it.
