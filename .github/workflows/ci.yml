name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The layer rule for the crate most tempted to break it (ADR-0009,
      # docs/01-architecture.md §Layer map): the extension module links
      # core + export and never egui or wgpu.
      - run: |
          if cargo tree -p riggen-py -e normal | grep -E '\b(egui|eframe|wgpu)\b'; then
            echo "riggen-py must not depend on egui or wgpu" >&2; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The visual snapshot scenarios (ADR-0003) render through wgpu. lavapipe
      # is the reference environment on purpose — `egui_kittest` sorts CPU
      # adapters first, so a developer's machine and this runner produce
      # comparable pixels. Without this the scenarios skip, and a suite that
      # silently skips in CI is worse than no suite.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test --workspace

  # The web demo (docs/plans/web-demo.md, ADR-0017). Not a build check any
  # more: this job produces the *same* bundle `pages.yml` deploys, so a page
  # that only breaks under wasm-bindgen breaks here first. `web/build.sh`
  # installs the `wasm-bindgen-cli` pinned to `Cargo.lock`'s `wasm-bindgen`
  # — the two halves of the ABI have to agree.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: web/build.sh
      # The bundle is only a bundle if the loader's two halves are both in
      # it: a `web/build.sh` that silently stopped copying the page would
      # otherwise deploy a directory of wasm and no index.
      - run: test -f web/dist/index.html -a -f web/dist/main.js -a -f web/dist/riggen_app_bg.wasm

  # The M3 acceptance (ADR-0004 §2, ADR-0008): the app's headless export
  # produces the sample arm's MJCF, MuJoCo loads it with zero compiler
  # warnings, and `mj_forward` agrees with `riggen_core::fk`. The only
  # Python in the test matrix.
  mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      # `--no-project`: without it `uv run` builds the wheel from the root
      # `pyproject.toml` before running anything.
      - run: cargo run -p riggen-app -- --export mjcf --fk-samples --out target/sample assets/fixtures/arm/arm.riggen
      - run: cargo run -p riggen-app -- --export mjcf --fk-samples --out target/sample-urdf assets/fixtures/arm/arm.urdf
      # The convex-decomposition acceptance (ADR-0011): the U-channel of
      # `bracket.stl` on a hinge, its collision a `ConvexDecomposition`.
      # `test_mjcf_load.py` fails a body that carries only one piece.
      - run: cargo run -p riggen-app -- --export mjcf --fk-samples --out target/sample-decomp assets/fixtures/bracket.riggen
      # The MJCF round trip (ADR-0015): the arm's own export read back and
      # written out again. `=target/sample` holds the *second* model to the
      # *first* document's FK — poses, sites, mjEQ_JOINT and model.nu — so
      # anything the import quietly lost fails here rather than agreeing
      # with itself.
      - run: cargo run -p riggen-app -- --export mjcf --fk-samples --out target/sample-mjcf-in target/sample/arm.xml
      - run: uv run --no-project --with mujoco --with numpy python python/tests/test_mjcf_load.py target/sample target/sample-urdf target/sample-decomp target/sample-mjcf-in target/sample-mjcf-in=target/sample

  # The SDF acceptance (ADR-0016 §6): the app's headless export produces the
  # sample arm's SDF, and libsdformat — the spec's own parser, through its
  # Python bindings — loads it, raising on anything illegal, resolves the
  # pose graph and the axis frames, and FK over what it resolved agrees with
  # `riggen_core::fk` to 1e-9. Tighter than the `mujoco` job's 1e-6 because
  # nothing in this loop is a simulator with its own integrator.
  #
  # `packages.osrfoundation.org` is the only third-party apt repository in
  # this workflow. It is here because `libsdformat` is in no Ubuntu archive
  # and on no wheel on PyPI, and the alternatives were measured and refused
  # (ADR-0016 §Context): pybullet ignores `//pose/@relative_to` silently and
  # is f32; `gz sdf -k` exits 0 on hard errors and computes no poses.
  sdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo curl -sSL https://packages.osrfoundation.org/gazebo.gpg \
            -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          sudo apt-get update
          sudo apt-get install -y gz-jetty-sdformat-python python3-numpy
      - run: cargo run -p riggen-app -- --export sdf --fk-samples --out target/sample-sdf assets/fixtures/arm/arm.riggen
      # The same robot through the URDF import, where the frames arrive as
      # dummy links: a different tree, the same FK.
      - run: cargo run -p riggen-app -- --export sdf --fk-samples --out target/sample-sdf-urdf assets/fixtures/arm/arm.urdf
      # And the convex decomposition (ADR-0011), whose pieces are one
      # `<collision>` each.
      - run: cargo run -p riggen-app -- --export sdf --fk-samples --out target/sample-sdf-decomp assets/fixtures/bracket.riggen
      # `/usr/bin/python3` by name: the bindings are an apt package under
      # `/usr/lib/python3/dist-packages`, which a tool-cache Python cannot see.
      - run: /usr/bin/python3 python/tests/test_sdf_load.py target/sample-sdf target/sample-sdf-urdf target/sample-sdf-decomp

  # The product (ADR-0002, ADR-0009): the wheel builds in the manylinux 2_28
  # container maturin-action provides — `build_wheel.py --binary-only`
  # first, for the `riggen` binary into the wheel data directory, then
  # maturin for the abi3 extension module — installs into a fresh venv with
  # nothing else, `test_wheel.py` runs it headlessly (--version, --export,
  # python -m riggen, import riggen._riggen, the abi3 tag), the SDK's
  # pytest suite and pyright run, and `examples/arm.py`'s export is
  # loaded in MuJoCo.
  # linux x86_64 only — the five-target matrix is `release.yml`'s; this job
  # is what guards `pyproject.toml`, `build_wheel.py` and
  # `python/riggen/__main__.py` on every push. The binary links only libc
  # and the container has a `python3`, so it needs no packages.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `riggen --version`'s hash and date (build.rs). Computed here because
      # the build runs in a container that cannot ask git about a checkout
      # another uid owns, and `github.sha` is the full 40 characters.
      - run: |
          echo "RIGGEN_GIT_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "RIGGEN_BUILD_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: 2_28
          docker-options: -e RIGGEN_GIT_HASH=${{ env.RIGGEN_GIT_HASH }} -e RIGGEN_BUILD_DATE=${{ env.RIGGEN_BUILD_DATE }}
          before-script-linux: python3 python/build_wheel.py --binary-only
      - uses: astral-sh/setup-uv@v5
      # Outside `target/`: rust-cache restores that directory, and a venv
      # from the previous run makes `uv venv` refuse to create one.
      - run: uv venv "$RUNNER_TEMP/wheel-venv" && uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl
      - run: python python/tests/test_wheel.py "$RUNNER_TEMP/wheel-venv"
      # The SDK suite on the installed wheel (docs/01 §Testing): pytest goes
      # into the same venv so `import riggen` is the wheel's, not the tree's.
      - run: |
          uv pip install --python "$RUNNER_TEMP/wheel-venv" pytest
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest python/tests/sdk
      # The types: the package, its stubs and the examples (pyproject
      # `[tool.pyright]`).
      - run: uvx pyright
      # The M3 bar over SDK output (ADR-0004 §2): the arm built by
      # `examples/arm.py` through the installed wheel loads in MuJoCo with
      # zero warnings and `mj_forward` matches its FK samples.
      - run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" examples/arm.py --out "$RUNNER_TEMP/sdk-arm"
          uv run --no-project --with mujoco --with numpy python python/tests/test_mjcf_load.py "$RUNNER_TEMP/sdk-arm"
