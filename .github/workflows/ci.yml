name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The visual snapshot scenarios (ADR-0003) render through wgpu. lavapipe
      # is the reference environment on purpose — `egui_kittest` sorts CPU
      # adapters first, so a developer's machine and this runner produce
      # comparable pixels. Without this the scenarios skip, and a suite that
      # silently skips in CI is worse than no suite.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown -p riggen-app

  # The M3 acceptance (ADR-0004 §2, ADR-0008): the app's headless export
  # produces the sample arm's MJCF, MuJoCo loads it with zero compiler
  # warnings, and `mj_forward` agrees with `riggen_core::fk`. The only
  # Python in the test matrix.
  mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - run: cargo run -p riggen-app -- --export mjcf --fk-samples --out target/sample assets/fixtures/arm/arm.riggen
      - run: cargo run -p riggen-app -- --export mjcf --fk-samples --out target/sample-urdf assets/fixtures/arm/arm.urdf
      - run: uv run --with mujoco --with numpy python python/tests/test_mjcf_load.py target/sample target/sample-urdf

  # The M4 product (ADR-0002): the maturin `bin` wheel builds in the
  # manylinux 2_28 container maturin-action provides, installs into a fresh
  # venv with nothing else, and its `riggen` runs headlessly
  # (`python/tests/test_wheel.py`: --version, --export, python -m riggen).
  # linux x86_64 only — the five-target matrix is `release.yml`'s; this job
  # is what guards `pyproject.toml` and `python/riggen/__main__.py` on every
  # push. The binary links only libc, so the container needs no packages.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `riggen --version`'s hash and date (build.rs). Computed here because
      # the build runs in a container that cannot ask git about a checkout
      # another uid owns, and `github.sha` is the full 40 characters.
      - run: |
          echo "RIGGEN_GIT_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "RIGGEN_BUILD_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: 2_28
          docker-options: -e RIGGEN_GIT_HASH=${{ env.RIGGEN_GIT_HASH }} -e RIGGEN_BUILD_DATE=${{ env.RIGGEN_BUILD_DATE }}
      - uses: astral-sh/setup-uv@v5
      # Outside `target/`: rust-cache restores that directory, and a venv
      # from the previous run makes `uv venv` refuse to create one.
      - run: uv venv "$RUNNER_TEMP/wheel-venv" && uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl
      - run: python python/tests/test_wheel.py "$RUNNER_TEMP/wheel-venv"
