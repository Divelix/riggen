# The release (plans/m4-distribution, ADR-0002): wheels for five targets
# plus the sdist, each wheel smoke-tested on a clean venv of its OS, then
# published — to TestPyPI on a manual dispatch, to PyPI and a GitHub Release
# on a `v*` tag push. Publishing uses PyPI trusted publishing, so there is
# no token in the repository's secrets: each index trusts this workflow
# file, in this repository, running in the named environment.
#
# One-time setup, by the human:
#   TestPyPI › project `riggen` › Publishing › add publisher:
#     owner Divelix, repository riggen, workflow release.yml, environment testpypi
#   PyPI    › project `riggen` › Publishing › add publisher:
#     owner Divelix, repository riggen, workflow release.yml, environment pypi
#   GitHub  › Settings › Environments: `testpypi` and `pypi` (protection
#     rules as wanted; `pypi` deserves a required reviewer).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v4
      # `riggen --version`'s hash and date (build.rs). Computed here because
      # the linux builds run in a container that cannot ask git about a
      # checkout another uid owns, and `github.sha` is the full 40 characters.
      - shell: bash
        run: |
          echo "RIGGEN_GIT_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "RIGGEN_BUILD_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
      # Linux: the manylinux 2_28 container (x86_64) or maturin-action's
      # cross container (aarch64). The binary links only libc, so neither
      # needs a package installed first.
      - if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: 2_28
          docker-options: -e RIGGEN_GIT_HASH=${{ env.RIGGEN_GIT_HASH }} -e RIGGEN_BUILD_DATE=${{ env.RIGGEN_BUILD_DATE }}
      # macOS builds both architectures on the arm64 runner (the Intel
      # runners are retired); Windows builds natively.
      - if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The wheel on a machine that never saw Rust: a fresh venv, the wheel from
  # the artefact, and `test_wheel.py` (--version, --export of the sample
  # arm, python -m riggen). Headless: no runner has a display.
  smoke:
    name: smoke ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v5
      - shell: bash
        run: |
          ls -l dist
          uv venv target/wheel-venv
          uv pip install --python target/wheel-venv --no-index --find-links dist riggen
      - shell: bash
        run: python python/tests/test_wheel.py target/wheel-venv

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [smoke, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-dispatch of the same version is a no-op, not a failure.
          skip-existing: true

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
