# The release (plans/m4-distribution, plans/python-sdk; ADR-0002,
# ADR-0009): wheels for five targets plus the sdist, each wheel smoke-tested
# on a clean venv of its OS, then published — to TestPyPI on a manual
# dispatch, to PyPI and a GitHub Release on a `v*` tag push. Every wheel
# has two halves (`python/build_wheel.py`): the `riggen` binary, built by
# cargo for the target and copied into maturin's wheel data directory, and
# the abi3 extension module `riggen._riggen`, built by maturin. Publishing uses PyPI trusted publishing, so there is
# no token in the repository's secrets: each index trusts this workflow
# file, in this repository, running in the named environment.
#
# One-time setup, by the human:
#   TestPyPI › project `riggen` › Publishing › add publisher:
#     owner Divelix, repository riggen, workflow release.yml, environment testpypi
#   PyPI    › project `riggen` › Publishing › add publisher:
#     owner Divelix, repository riggen, workflow release.yml, environment pypi
#   GitHub  › Settings › Environments: `testpypi` and `pypi` (protection
#     rules as wanted; `pypi` deserves a required reviewer).
#
# The same tag push publishes the five Rust crates to crates.io
# (`publish-crates-io`, docs/ARCHITECTURE.md §Crates.io distribution), so
# that `cargo install riggen` works. crates.io has no staging index, so a
# dispatch never publishes there. It is trusted publishing as well, but
# crates.io only lets a publisher be added to a crate that already exists:
#   GitHub  › Settings › Environments: `crates-io` (a required reviewer: a
#     crates.io version can be yanked, never replaced).
#   First release only: a crates.io API token (scopes publish-new and
#     publish-update) as the secret CARGO_REGISTRY_TOKEN in `crates-io`.
#   After it: crates.io › each of riggen, riggen-mesh, riggen-core,
#     riggen-export, riggen-viewport › Settings › Trusted Publishing › add:
#     owner Divelix, repository riggen, workflow release.yml, environment
#     crates-io. Then delete the secret; the job falls back to it only
#     while it exists.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full triples: the same string reaches maturin-action's `target`
        # and `build_wheel.py --target`, so both cargo runs agree on
        # `target/<triple>/release/`.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      # `riggen --version`'s hash and date (build.rs). Computed here because
      # the linux builds run in a container that cannot ask git about a
      # checkout another uid owns, and `github.sha` is the full 40 characters.
      - shell: bash
        run: |
          echo "RIGGEN_GIT_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "RIGGEN_BUILD_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
      # Linux: both halves inside the manylinux 2_28 container (x86_64) or
      # maturin-action's cross container (aarch64) — the binary half in
      # `before-script-linux`, which runs after the action installed Rust
      # and the target and put `/opt/python/*/bin` on PATH; the containers
      # have a `python3`. The binary links only libc, so neither needs a
      # package installed first.
      - if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: 2_28
          docker-options: -e RIGGEN_GIT_HASH=${{ env.RIGGEN_GIT_HASH }} -e RIGGEN_BUILD_DATE=${{ env.RIGGEN_BUILD_DATE }}
          before-script-linux: python3 python/build_wheel.py --binary-only --target ${{ matrix.target }}
      # macOS and Windows: the binary half on the runner first (macOS builds
      # both architectures on the arm64 runner — the Intel runners are
      # retired; Windows builds natively), then maturin-action for the
      # extension. setup-python so `python` is the same spelling on both.
      - if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os != 'Linux'
        shell: bash
        run: python python/build_wheel.py --binary-only --target ${{ matrix.target }}
      - if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The wheel on a machine that never saw Rust: a fresh venv, the wheel from
  # the artefact, and `test_wheel.py` (--version, --export of the sample
  # arm, python -m riggen, import riggen._riggen, the abi3 tag). Headless:
  # no runner has a display. A `-dev` workspace version is a pre-release
  # (`0.2.0.dev0`); `uv` accepts it because it is the only version in `dist`.
  smoke:
    name: smoke ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v5
      - shell: bash
        run: |
          ls -l dist
          uv venv target/wheel-venv
          uv pip install --python target/wheel-venv --no-index --find-links dist riggen
      - shell: bash
        run: python python/tests/test_wheel.py target/wheel-venv

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [smoke, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-dispatch of the same version is a no-op, not a failure.
          skip-existing: true

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # `cargo publish --workspace` packages and builds all five crates first,
  # then uploads them in dependency order, waiting for each to reach the
  # index. A failed build therefore uploads nothing. `riggen-py` is
  # `publish = false`.
  publish-crates-io:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    env:
      # Mapped here because a step's `if:` cannot read a secret.
      REGISTRY_TOKEN_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Belt and braces: .agents/rules/git.md already forbids tagging a
      # `-dev` commit, but a crates.io version cannot be replaced. The tag
      # must also name the version the crates carry.
      - shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "riggen"))')
          echo "workspace version $version, tag $GITHUB_REF_NAME"
          case "$version" in
            *-*) echo "::error::refusing to publish the pre-release $version"; exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name version $version"; exit 1
          fi
      - if: env.REGISTRY_TOKEN_SECRET == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.REGISTRY_TOKEN_SECRET }}
