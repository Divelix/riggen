<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>riggen — robot assembler in the browser</title>
    <meta
      name="description"
      content="riggen: drop meshes, build the kinematic tree, export MJCF, URDF and SDF — running in the browser."
    />
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
        color: #d8d8d8;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* eframe reads the canvas' CSS content rect, so the canvas is sized
         here and the app follows the window. */
      #riggen_canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      /* Shown until the wasm bundle has started painting; also the frame the
         WebGPU and panic messages are written into. */
      #message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        box-sizing: border-box;
        background: #1e1e1e;
      }

      #message[hidden] {
        display: none;
      }

      .sheet {
        max-width: 44rem;
        line-height: 1.55;
      }

      .sheet h1 {
        font-size: 1.4rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }

      .sheet p {
        margin: 0 0 0.75rem;
      }

      .sheet a {
        color: #7fb2f0;
      }

      .sheet pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.78rem;
        color: #9a9a9a;
        max-height: 40vh;
        overflow: auto;
        margin: 0;
      }

      .spinner {
        color: #8a8a8a;
      }
    </style>
  </head>
  <body>
    <canvas id="riggen_canvas"></canvas>
    <div id="message">
      <div class="sheet"><p class="spinner">Loading riggen…</p></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
