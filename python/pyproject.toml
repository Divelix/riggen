# The `riggen` wheel. Today: a name reservation on PyPI — a package that
# says the application is coming and points at the repository. M4
# (docs/03-roadmap.md) replaces this build with maturin `bindings = "bin"`,
# which packages the Rust `riggen` executable under the same name
# (docs/adr/0002-binary-in-wheel-before-pyo3.md).
#
# Build and publish from this directory:  uv build && uv publish

[project]
name = "riggen"
version = "0.0.1"
description = "The blazingly fast, lightweight robot assembler for RL researchers — name reservation; the app ships as 0.1.0"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Sergei Sergienko" }]
keywords = ["robotics", "mujoco", "mjcf", "urdf", "reinforcement-learning", "simulation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Divelix/riggen"

[project.scripts]
riggen = "riggen:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riggen"]

# The licence texts are copies of the repository root's: hatchling stores a
# symlink as a symlink in the sdist, and a wheel built from that sdist then
# has no licence files at all.
[tool.hatch.build.targets.sdist]
include = ["riggen", "README.md", "pyproject.toml"]
